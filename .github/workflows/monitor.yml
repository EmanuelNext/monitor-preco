name: Monitor de preco
on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  workflow_dispatch:          # permite rodar manualmente
    inputs:
      teste:
        description: Enviar uma notificação de teste
        type: boolean
        default: false

permissions:
  contents: write             # para gravar o estado.json no repositório

concurrency: monitor-preco    # evita duas execuções gravando o estado ao mesmo tempo

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TESTE: ${{ inputs.teste }}
      - name: Salvar estado dos alertas
        if: always()
        run: |
          git add estado.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza estado dos alertas"
          git push
